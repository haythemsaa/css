name: css_app
description: Club Sportif Sfaxien - Application Mobile Officielle
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Network & API
  dio: ^5.4.0
  http: ^1.1.2
  connectivity_plus: ^5.0.2

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.0.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9

  # Media
  video_player: ^2.8.2
  chewie: ^1.7.5
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  flutter_cache_manager: ^3.3.1

  # Authentication
  local_auth: ^2.1.8
  flutter_facebook_auth: ^6.0.4
  google_sign_in: ^6.2.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.3
  share_plus: ^7.2.2
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.2.0
  fluttertoast: ^8.2.4
  flutter_local_notifications: ^16.3.2

  # Payment
  flutter_stripe: ^10.1.1

  # Charts & Graphs
  fl_chart: ^0.66.2

  # PDF
  printing: ^5.11.1
  pdf: ^3.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
