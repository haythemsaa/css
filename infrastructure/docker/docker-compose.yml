version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: css_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../../backend:/var/www
    networks:
      - css_network
    depends_on:
      - mysql
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: css_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ../../backend:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - css_network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: css_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-css_database}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-css_user}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - css_network

  # Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: css_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - css_network

  # Queue Worker
  queue:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: css_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - ../../backend:/var/www
    networks:
      - css_network
    depends_on:
      - mysql
      - redis

  # Scheduler
  scheduler:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: css_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    volumes:
      - ../../backend:/var/www
    networks:
      - css_network
    depends_on:
      - mysql
      - redis

networks:
  css_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
